name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-partykit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PartyKit only
        run: npm install partykit

      - name: Deploy to PartyKit
        run: npx partykit deploy
        env:
          PARTYKIT_LOGIN: sat-b
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
